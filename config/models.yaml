# Per-model params (PLAN.md section 5, docs/models.md)
equal_weight: {}
index_buy_hold: {}
mean_variance:
  lookback_days: 1260 # rolling window (5y daily)
  weight_cap: 0.10 # long-only, per-name cap
ml_forecast: # Gu-Kelly-Xiu GBRT + Ma et al. MV pipeline
  horizon: M
  refit: Y # annual refit (GKX cadence)
  grid: {} # depth/shrinkage/trees — GKX Internet Appendix Table A.5 values at implementation
  weight_cap: 0.10
black_litterman: # Kolm & Ritter (2021) BLB; derivation Kolm & Ritter (2017)
  factors: [momentum, value, quality, sentiment, attention]
  prior: data-driven # xi = expanding mean of OLS factor returns; V = factor covariance
  view_uncertainty: diag_v # Omega = diag(v_ii), paper eq. 24
  risk_aversion: null # delta, paper eq. 29
  winsorize: null # D floor at implementation
  weight_cap: 0.10
rl:
  rebalance: D # native daily cadence
  checkpoint: null # trained policy path; eval rl default (--checkpoint overrides)
