lseg:
  start: "1994-01-01" # LSEG keeps S&P500 joiner/leaver records back to 1994
  constituents_out: data/raw/lseg/constituents.parquet
  joiners_leavers_out: data/raw/lseg/joiners_leavers.parquet
  mapping_out: data/raw/lseg/ric_mapping.parquet
  market_cap_out: data/raw/lseg/market_cap.parquet
  prices_out: data/raw/lseg/prices
  ric_fallbacks: # in case content lives under another RIC
    KHC.OQ: KHC.N # same company (Kraft Heinz
    FSR.N^B01: USB.N # same company (U.S. Bancorp)

yahoo:
  prices_out: data/raw/yahoo/prices
  extra_prices_out: data/interim/extra_prices.parquet
  extra_symbols: ["^GSPC", "^VIX", "^IRX"] # extra series
  symbol_overrides: {} # universe RIC -> Yahoo symbol (if ticker differs)

universe:
  top_n: 50
  exclude_rics: ["ENE.N^A02"] # no LSEG or Yahoo prices
  start: "1997-12-31" # behavioral data starts in 1998
  end: "2026-01-01"
  universe_out: data/interim/universe.parquet
  assets_out: data/interim/assets.parquet

marketpsych:
  start: "1998-01-01" # LMA company history begins January 1998
  end: "2026-01-01" # exclusive, matches universe.end
  asset_classes: [equamer, equemea] # CMPNY_AMER + CMPNY_EMEA (guide ch. 7). AMER-only leaves
  #                        EMEA-domiciled universe names (ACN, SHEL, UN, RIG, MDT) empty;
  #                        EMEA is 0.87 GiB over 336 files. MP never covered the pre-merger
  #                        rics (T.N^K05, S.N^G13, GM.N^F09, …) and its ticker column collides
  #                        there (S=SentinelOne, LIN=LIN Media, T=Telus), so those rics stay
  #                        empty and show up in the build step's "no marketpsych rows" warning.
  frequency: dai # daily, 24h window stamped 15:30 ET
  datatypes: ["News_Social"] # combined news + social content; applied client-side (row filter)
  datacols: ["buzz", "sentiment"] # attention, net sentiment; applied client-side (column select)
  # MarketPsych keys a few entities on a different PermID than LSEG's Organization PermID for
  # the same RIC. Aliases are generated from the vendor reference: current-link
  # (CurrentInstrumentIssuerPermid) plus a normalized-name fallback for unlinked legal entities
  # (XOM among them). No manual alias config.
  reference_out: data/raw/marketpsych/reference/assets.parquet
  # the file API exposes no asset/datatype/column selection: whole months (Archive zips) and
  # single days (Live TSVs) are downloaded, then clipped to [start, end) by the build step
  raw_out: data/raw/marketpsych
  out: data/interim/behavioral.parquet

prices:
  out: data/interim/prices.parquet

technicals:
  out: data/interim/technicals.parquet

panel:
  out: data/processed/panel.parquet

split:
  train_out: data/processed/train.parquet
  test_out: data/processed/test.parquet
