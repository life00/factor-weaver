[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-weaver"
version = "0.1.0"
description = "RL framework for portfolio management integrating price, technical, fundamental, and behavioral features"
requires-python = ">=3.10"
dependencies = [
    "lseg-data>=2.0",
    "mlflow>=2.0",
    "openpyxl>=3.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "PyPortfolioOpt>=1.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "yfinance>=0.2.50",
]

[project.scripts]
factor-weaver = "factor_weaver.cli:main"

[project.optional-dependencies]
dev = ["duckdb>=1.5", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
